# Global allowlist. It applies to all rules.
#
# The regexes, stopwords and skip_path_regexes that are marked "gitleaks"
# come from the gitleaks default config. MIT license. See THIRD_PARTY.md.

# Exact values that are never findings. These are documented example keys.
values:
  - AKIAIOSFODNN7EXAMPLE
  - wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  - AKIAI44QH8DHBEXAMPLE
  - je7MtGbClwBF/2Zp9Utk/h3yCo8nvbEXAMPLEKEY

# Regexes that apply to the secret.
regexes:
  # Placeholders.
  - '(?i)^(?:x+|\*+|\.+|-+|_+|0+|#+)$'
  - '(?i)x{4,}'
  - '^<[^<>]*>$'
  - '(?i)<(?:your|my|insert|replace|enter|put)[^<>]*>'
  - '\$\{[^}]*\}'
  - '\{\{[^}]*\}\}'
  - '(?i)example(?:key)?$'
  - '(?i)^(?:changeme|change_me|password|passw0rd|secret|redacted|dummy|sample|placeholder|notasecret)$'
  # gitleaks
  - '(?i)^(?:true|false|null)$'
  - '^(?i:a+|b+|c+|d+|e+|f+|g+|h+|i+|j+|k+|l+|m+|n+|o+|p+|q+|r+|s+|t+|u+|v+|w+|x+|y+|z+|\*+|\.+)$'
  - '^\$(?:\d+|{\d+})$'
  - '^\$(?:[A-Z_]+|[a-z_]+)$'
  - '^\${(?:[A-Z_]+|[a-z_]+)}$'
  - '^\{\{[ \t]*[\w ().|]+[ \t]*}}$'
  - '^\$\{\{[ \t]*(?:(?:env|github|secrets|vars)(?:\.[A-Za-z]\w+)+[\w "''&./=|]*)[ \t]*}}$'
  - '^%(?:[A-Z_]+|[a-z_]+)%$'
  - '^%[+\-# 0]?[bcdeEfFgGoOpqstTUvxX]$'
  - '^\{\d{0,2}}$'
  - '^@(?:[A-Z_]+|[a-z_]+)@$'
  - '^/Users/(?i)[a-z0-9]+/[\w .-/]+$'
  - '^/(?:bin|etc|home|opt|tmp|usr|var)/[\w ./-]+$'

# A finding is dropped when the secret contains one of these words.
stopwords:
  - abcdefghijklmnopqrstuvwxyz
  - "0123456789abcdef"
  # gitleaks
  - 014df517-39d1-4453-b7b3-9930c563627c

# Glob patterns for paths that the scanner never reads.
skip_paths:
  - vendor/
  - node_modules/
  - bower_components/
  - "*.min.js"
  - "*.min.css"
  - "*.js.map"
  - "*.css.map"
  # Lockfiles.
  - package-lock.json
  - npm-shrinkwrap.json
  - yarn.lock
  - pnpm-lock.yaml
  - deno.lock
  - go.sum
  - go.work.sum
  - Cargo.lock
  - poetry.lock
  - Pipfile.lock
  - Gemfile.lock
  - composer.lock
  - gradle.lockfile
  - mix.lock
  - pubspec.lock
  - Podfile.lock
  - packages.lock.json
  # Images, fonts and documents.
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.bmp"
  - "*.ico"
  - "*.webp"
  - "*.svg"
  - "*.tif"
  - "*.tiff"
  - "*.psd"
  - "*.woff"
  - "*.woff2"
  - "*.ttf"
  - "*.otf"
  - "*.eot"
  - "*.pdf"

# Regexes for paths that the scanner never reads.
skip_path_regexes:
  # Rule files match their own regexes.
  - '(?:^|/)gitleaks\.toml$'
  - '(?:^|/)rules/gitleaks\.yaml$'
  # gitleaks
  - '(?:^|/)gradlew(?:\.bat)?$'
  - '(?:^|/)mvnw(?:\.cmd)?$'
  - '(?:^|/)\.mvn/wrapper/MavenWrapperDownloader\.java$'
  - '(?:^|/)(?:angular|bootstrap|jquery(?:-?ui)?|plotly|swagger-?ui)[a-zA-Z0-9.-]*(?:\.min)?\.js(?:\.map)?$'
  - '(?i)(?:^|/)(?:v?env|virtualenv)/lib(?:64)?(?:/.*)?$'
  - '(?i)(?:^|/)(?:lib(?:64)?/python[23](?:\.\d{1,2})+|python/[23](?:\.\d{1,2})+/lib(?:64)?)(?:/.*)?$'
  - '(?i)(?:^|/)[a-z0-9_.]+-[0-9.]+\.dist-info(?:/.+)?$'
  - '(?:^|/)vendor/(?:bundle|ruby)(?:/.*?)?$'
  - '\.gem$'
  - 'verification-metadata\.xml'

# Glob patterns for paths where a finding gets the severity "low" instead
# of being dropped.
downgrade_paths:
  - test/fixtures/
  - "**/testdata/"
  - "**/__fixtures__/"
  - "**/fixtures/"
